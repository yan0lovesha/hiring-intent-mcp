name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node 22 Smoke & MCP Metadata Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate MCP Registry & Glama metadata
        run: |
          node -e '
            const fs = require("node:fs");
            const assert = require("node:assert/strict");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const srv = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const glama = JSON.parse(fs.readFileSync("glama.json", "utf8"));
            assert.equal(srv.name, "io.github.yan0lovesha/hiring-intent-mcp");
            assert.equal(srv.version, pkg.version);
            assert.ok(srv.description.length > 0 && srv.description.length <= 100);
            assert.ok(Array.isArray(srv.remotes) && srv.remotes.length > 0 && srv.remotes[0].type === "streamable-http");
            assert.ok(Array.isArray(glama.maintainers) && glama.maintainers.includes("yan0lovesha"));
            console.log("MCP directory metadata validated:", srv.name, srv.version);
          '

      - name: Run MCP stdio & live multi-ATS smoke tests
        run: npm test
