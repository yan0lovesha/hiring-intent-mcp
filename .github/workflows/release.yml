name: Release (npm + Official MCP Registry)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  release:
    name: Publish b2b-hiring-intent-mcp to npm and the Official MCP Registry
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure npm CLI supports trusted publishing (>= 11.5.1)
        run: |
          set -euo pipefail
          current="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$current" | sort -V | head -n1)" != "11.5.1" ]; then
            npm install -g npm@11
          fi
          npm --version

      - name: Verify tag, package.json and server.json versions match
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          srv_version="$(node -p "require('./server.json').version")"
          test "$pkg_version" = "$srv_version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "v${pkg_version}"
          fi
          echo "PKG_VERSION=${pkg_version}" >> "$GITHUB_ENV"

      - name: Run smoke tests
        run: npm test

      - name: Publish to npm via trusted publishing (OIDC, no stored token)
        id: npm
        run: |
          set -euo pipefail
          if npm view "b2b-hiring-intent-mcp@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "b2b-hiring-intent-mcp@${PKG_VERSION} already live on npm"
            echo "mode=live" >> "$GITHUB_OUTPUT"
          elif npm publish --access public; then
            echo "mode=live" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Direct npm publish was refused; falling back to npm stage publish (needs maintainer 2FA approval on npmjs.com)."
            npm stage publish --access public
            echo "mode=staged" >> "$GITHUB_OUTPUT"
          fi

      - name: Await maintainer approval of the staged npm version
        if: steps.npm.outputs.mode == 'staged'
        run: |
          echo "::notice::b2b-hiring-intent-mcp@${PKG_VERSION} is staged. Approve it at npmjs.com (Staged Packages), then run the 'Publish to Official MCP Registry (manual fallback)' workflow."

      - name: Install cosign
        if: steps.npm.outputs.mode == 'live'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.npm.outputs.mode == 'live'
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          chmod +x mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        if: steps.npm.outputs.mode == 'live'
        run: ./mcp-publisher validate

      - name: Publish server to Official MCP Registry
        if: steps.npm.outputs.mode == 'live'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
